<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5cc8ff">
<script>window.JOGO_ARQUIVO=true</script>
<title>Missão Cuidar do Dinheiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: palco de uma tela só. Céu e colinas ao fundo; no centro, cartões brancos
   tipo "adesivo" (máx. 920px) com botões grandes de apertar. Visual único e diurno, por escolha. */
:root {
  --ceu1: #5cc8ff; --ceu2: #c4f0ff; --colina1: #93e26b; --colina2: #53c67b;
  --tinta: #1f2a5a; --tinta2: #55608f; --papel: #ffffff; --papel2: #f1f6ff; --linha: #d6e1fa;
  --sol: #ffd23f; --sol-esc: #e0a200;
  --coral: #ff6b5e; --coral-esc: #d6443a;
  --menta: #18c29c; --menta-esc: #0d977a;
  --uva: #7a5cff; --uva-esc: #563be0;
  --laranja: #ff9a1f; --laranja-esc: #dd7700;
  --verde: #2fbf71; --verde-esc: #1d9655;
  --rosa: #ff86b3; --rosa-esc: #e8558c;
  --azul: #2f8cff; --azul-esc: #1a67d2;
  --f-titulo: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji";
  --f-texto: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji";
  --raio: 22px;
  --din: 58px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ceu1); color: var(--tinta);
  font-family: var(--f-texto); font-size: 17px; font-weight: 700; line-height: 1.35;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-titulo); line-height: 1.05; text-wrap: balance; }
:focus-visible { outline: 4px solid var(--uva); outline-offset: 3px; }
svg { display: block; }

.app { position: relative; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, var(--ceu1) 0%, var(--ceu2) 70%); }

/* ---------- Cenário ---------- */
.cenario { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.sol { position: absolute; top: -50px; right: -40px; width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle, #fff3a6 0 34%, var(--sol) 35% 52%, rgba(255,210,63,.35) 53% 70%, rgba(255,210,63,0) 71%); }
.nuvem { position: absolute; width: 150px; height: 46px; border-radius: 46px; background: var(--papel); opacity: .85;
  animation: nuvem 60s linear infinite; }
.nuvem::before, .nuvem::after { content: ""; position: absolute; background: var(--papel); border-radius: 50%; }
.nuvem::before { width: 62px; height: 62px; left: 22px; top: -30px; }
.nuvem::after { width: 46px; height: 46px; left: 74px; top: -20px; }
.nuvem.n1 { top: 9%; left: -160px; }
.nuvem.n2 { top: 24%; left: -160px; transform: scale(.7); animation-duration: 85s; animation-delay: -30s; opacity: .7; }
.nuvem.n3 { top: 4%; left: -160px; transform: scale(.55); animation-duration: 110s; animation-delay: -70s; opacity: .6; }
@keyframes nuvem { to { left: 105%; } }
.colinas { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; min-height: 120px; }
.colinas svg { width: 100%; height: 100%; }

/* ---------- Telas ---------- */
.tela { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-block: 14px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: entra .35s ease both; }
@keyframes entra { from { transform: translateY(14px); } to { transform: none; } }
.miolo { width: 100%; max-width: 920px; margin: 0 auto; }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 10px 26px; border-radius: 18px;
  font-family: var(--f-titulo); font-size: 1.35rem; font-weight: 800; letter-spacing: .02em;
  color: #fff; background: var(--cb, var(--azul)); box-shadow: 0 6px 0 var(--cs, var(--azul-esc)), 0 10px 18px rgba(31,42,90,.18);
  transition: transform .08s, box-shadow .08s, filter .15s; user-select: none; -webkit-user-select: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--cs, var(--azul-esc)), 0 4px 8px rgba(31,42,90,.18); }
.btn[disabled] { filter: grayscale(.7) opacity(.55); pointer-events: none; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }
.btn-verde { --cb: var(--verde); --cs: var(--verde-esc); }
.btn-sol { --cb: var(--sol); --cs: var(--sol-esc); color: var(--tinta); }
.btn-coral { --cb: var(--coral); --cs: var(--coral-esc); }
.btn-uva { --cb: var(--uva); --cs: var(--uva-esc); }
.btn-claro { --cb: var(--papel); --cs: var(--linha); color: var(--tinta); }
.btn-g { min-height: 72px; font-size: 1.9rem; padding: 12px 44px; border-radius: 24px; }
.btn-p { min-height: 46px; font-size: 1.05rem; padding: 6px 16px; border-radius: 14px; }
.btn-ic { width: 52px; min-width: 52px; height: 52px; min-height: 52px; padding: 0; border-radius: 16px; }
.btn-ic svg { width: 28px; height: 28px; }

.cartao { background: var(--papel); border-radius: var(--raio); box-shadow: 0 8px 0 rgba(31,42,90,.10), 0 14px 30px rgba(31,42,90,.16); }
.selo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px;
  background: var(--papel); color: var(--tinta); font-family: var(--f-titulo); font-weight: 800; font-size: 1.1rem;
  box-shadow: 0 3px 0 rgba(31,42,90,.12); }
.selo svg { width: 22px; height: 22px; }

/* ---------- Mascote ---------- */
.mascote { width: 100%; }
.mascote svg { width: 100%; height: auto; overflow: visible; }
.masc-corpo { transform-origin: 100px 170px; animation: respira 3.2s ease-in-out infinite; }
@keyframes respira { 50% { transform: scale(1.025, .975); } }
.masc-moeda { animation: moedinha 2.6s ease-in-out infinite; }
@keyframes moedinha { 0%, 100% { transform: translateY(-10px); } 50% { transform: translateY(6px); } }
.olhos, .boca { display: none; }
.mascote[data-humor="neutro"] .o-neutro, .mascote[data-humor="neutro"] .b-neutro,
.mascote[data-humor="feliz"] .o-feliz, .mascote[data-humor="feliz"] .b-feliz,
.mascote[data-humor="triste"] .o-triste, .mascote[data-humor="triste"] .b-triste { display: inline; }
.o-neutro { transform-origin: 100px 92px; animation: pisca 4.5s infinite; }
@keyframes pisca { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.1); } }
.mascote[data-humor="feliz"] .masc-corpo { animation: pula .55s ease 2; }
@keyframes pula { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) scale(.97, 1.04); } 70% { transform: translateY(0) scale(1.04, .95); } }
.mascote[data-humor="triste"] .masc-corpo { animation: balanca .5s ease 1; }
@keyframes balanca { 20% { transform: rotate(-5deg); } 60% { transform: rotate(5deg); } }

/* ---------- Dinheiro ---------- */
.din { display: inline-block; flex: none; line-height: 0; filter: drop-shadow(0 3px 0 rgba(31,42,90,.22)); }
.din-moeda { width: calc(var(--din) * var(--s, 1)); height: calc(var(--din) * var(--s, 1)); }
.din-nota { width: calc(var(--din) * 2); height: var(--din); }
.din svg { width: 100%; height: 100%; }
.grupo-din { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }

/* ---------- Modal ---------- */
.modal { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
  background: rgba(31,42,90,.55);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal-caixa { width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; padding: 22px 22px 20px;
  animation: pop .3s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { transform: scale(.7); } to { transform: none; } }
.modal-caixa h2 { font-size: 1.7rem; margin-bottom: 10px; }
.modal-caixa h3 { font-size: 1.15rem; margin: 14px 0 4px; color: var(--uva-esc); }
.modal-caixa p, .modal-caixa li { font-weight: 600; font-size: .98rem; }
.modal-caixa ul { margin: 4px 0; padding-left: 20px; }
.modal-acoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; margin-top: 18px; }

/* ---------- Confete ---------- */
.confete { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
.confete i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: cai linear forwards; }
@keyframes cai { to { transform: translate3d(var(--dx, 0), 110vh, 0) rotate(var(--rot, 720deg)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.colinas .c1 { fill: var(--colina1); }
.colinas .c2 { fill: var(--colina2); }

/* ---------- Tela inicial ---------- */
.inicio { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.faixa { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(1.2rem, 4.4vw, 2rem); letter-spacing: .08em;
  color: var(--tinta); background: var(--sol); padding: 2px 26px; border-radius: 14px; transform: rotate(-2deg);
  box-shadow: 0 5px 0 var(--sol-esc); }
.titulo { font-size: clamp(2.1rem, 8.6vw, 4.6rem); font-weight: 800; color: var(--papel); letter-spacing: .01em;
  text-shadow: 0 3px 0 var(--azul-esc), 0 6px 0 var(--tinta), 0 12px 18px rgba(31,42,90,.3); max-width: 15ch; }
.titulo span { display: block; color: var(--sol); font-size: 1.28em; }
.inicio-palco { position: relative; width: min(240px, 46vw, 34vh); margin: 2px 0 4px; }
.inicio-masc { position: relative; }
.chuva { position: absolute; inset: -30px -90px; }
.chuva .din { position: absolute; --din: 34px; animation: flutua 4s ease-in-out infinite; }
@keyframes flutua { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-16px) rotate(8deg); } }
.inicio-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
#b-jogar { animation: chama 1.6s ease-in-out infinite; }
@keyframes chama { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- Quem vai jogar ---------- */
.jogador-cx { padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; max-width: 640px; margin: 10px auto; }
.jogador-cx h2 { font-size: 1.7rem; margin-top: 4px; }
.rotulo { font-size: .95rem; color: var(--tinta2); }
.campo { width: 100%; min-height: 56px; padding: 8px 18px; border-radius: 16px; border: 3px solid var(--linha); background: var(--papel2);
  font-family: var(--f-titulo); font-size: 1.4rem; font-weight: 700; color: var(--tinta); }
.campo:focus { border-color: var(--uva); outline: none; }
.campo::placeholder { color: var(--tinta2); opacity: .6; }
.anos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ano { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 8px 12px; border-radius: 20px;
  background: var(--papel2); border: 4px solid var(--linha); color: var(--tinta); text-align: center; transition: transform .1s; }
.ano b { font-family: var(--f-titulo); font-size: 2.6rem; line-height: 1; }
.ano span { font-family: var(--f-titulo); font-size: 1.1rem; }
.ano small { font-size: .78rem; font-weight: 700; color: var(--tinta2); margin-top: 4px; line-height: 1.2; }
.ano:active { transform: scale(.96); }
.ano.sel { background: var(--sol); border-color: var(--sol-esc); box-shadow: 0 5px 0 var(--sol-esc); transform: translateY(-3px); }
.ano.sel small { color: var(--tinta); }
.chave { display: flex; align-items: center; gap: 12px; padding: 8px 4px; cursor: pointer; font-size: 1rem; }
.chave input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chave-trilho { flex: none; width: 58px; height: 32px; border-radius: 32px; background: var(--linha); position: relative; transition: background .2s; }
.chave-trilho::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--papel); box-shadow: 0 2px 4px rgba(31,42,90,.3); transition: left .2s; }
.chave input:checked + .chave-trilho { background: var(--verde); }
.chave input:checked + .chave-trilho::after { left: 30px; }
.chave input:focus-visible + .chave-trilho { outline: 4px solid var(--uva); outline-offset: 3px; }
#b-entrar { align-self: center; margin-top: 6px; }

/* ---------- Mapa ---------- */
.mapa { display: flex; flex-direction: column; gap: 12px; }
.mapa-topo, .sub-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.espaco { flex: 1; }
.mapa-quem { min-height: 46px; font-size: 1.15rem; }
.mapa-quem em { font-style: normal; background: var(--uva); color: #fff; padding: 0 10px; border-radius: 999px; font-size: .95rem; }
.mapa-dica { display: flex; align-items: center; gap: 10px; }
.mapa-dica .mascote { width: 86px; flex: none; }
.balao { position: relative; background: var(--papel); border-radius: 20px; padding: 10px 16px; box-shadow: 0 5px 0 rgba(31,42,90,.12); min-width: 0; }
.balao::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right-color: var(--papel); border-left: 0; }
.fases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.fase-bt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 10px 12px; border-radius: 26px;
  background: var(--cf); color: #fff; text-align: center; box-shadow: 0 8px 0 var(--cfs), 0 14px 22px rgba(31,42,90,.2); transition: transform .1s, box-shadow .1s; }
.fase-bt:hover { transform: translateY(-3px); }
.fase-bt:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cfs); }
.fase-num { position: absolute; top: -8px; left: -6px; width: 40px; height: 40px; border-radius: 50%; background: var(--papel); color: var(--tinta);
  font-family: var(--f-titulo); font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(31,42,90,.2); }
.fase-ic { font-size: 3rem; line-height: 1.15; height: 62px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 3px 0 rgba(31,42,90,.25)); }
.fase-ic .din { --din: 52px; filter: none; }
.fase-tit { font-family: var(--f-titulo); font-size: 1.2rem; font-weight: 800; line-height: 1.05; min-height: 2.2em; display: flex; align-items: center; }
.fase-estrelas { display: flex; gap: 2px; background: rgba(31,42,90,.22); padding: 3px 10px; border-radius: 999px; }
.fase-estrelas svg { width: 22px; height: 22px; }
.fase-bt.proxima::after { content: "JOGUE AGORA"; position: absolute; top: -10px; right: -4px; background: var(--papel); color: var(--coral-esc);
  font-family: var(--f-titulo); font-size: .8rem; font-weight: 800; padding: 1px 10px; border-radius: 999px; box-shadow: 0 3px 0 rgba(31,42,90,.2); animation: chama 1.4s ease-in-out infinite; }
.est { fill: var(--sol); stroke: var(--sol-esc); stroke-width: 6; stroke-linejoin: round; }
.est.vazia { fill: rgba(255,255,255,.35); stroke: rgba(31,42,90,.25); }

/* ---------- Fim de fase ---------- */
.fim-cx { max-width: 620px; margin: 6px auto; padding: 20px 20px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fim-sub { color: var(--tinta2); font-size: 1rem; }
.fim-cx h2 { font-size: clamp(1.8rem, 6vw, 2.6rem); color: var(--uva-esc); }
.estrelas { display: flex; gap: 6px; justify-content: center; }
.estrelas svg { width: clamp(56px, 16vw, 84px); height: clamp(56px, 16vw, 84px); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.estrelas svg:nth-child(2) { animation-delay: .25s; transform-origin: center; margin-top: -10px; }
.estrelas svg:nth-child(3) { animation-delay: .5s; }
.estrelas .est.vazia { fill: var(--papel2); stroke: var(--linha); }
.fim-linha { display: flex; align-items: center; justify-content: center; gap: 18px; }
.fim-medalha { width: 110px; }
.fim-linha .mascote { width: 120px; }
.fim-pontos { font-family: var(--f-titulo); font-size: 1.6rem; font-weight: 800; }
.fim-pontos b { color: var(--laranja-esc); font-size: 1.25em; }
.fim-msg { font-size: 1.05rem; max-width: 44ch; }
.fim-novas { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.nova { display: inline-flex; align-items: center; gap: 8px; background: var(--papel2); border: 3px solid var(--sol); border-radius: 16px; padding: 4px 14px 4px 6px; font-size: .95rem; animation: pop .5s .8s both; }
.nova .med-ic { width: 40px; }
.fim-acoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; }

/* ---------- Medalhas ---------- */
.sub-topo { margin-bottom: 12px; }
.sub-topo h2 { flex: 1; font-size: clamp(1.6rem, 6vw, 2.2rem); color: var(--papel); text-shadow: 0 3px 0 var(--tinta); }
.med-cx { padding: 18px 18px 22px; }
.med-cx h3 { font-size: 1.25rem; color: var(--uva-esc); margin: 6px 0 10px; }
.med-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; margin-bottom: 14px; }
.med { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 6px; border-radius: 18px; background: var(--papel2); }
.med .med-ic { width: 72px; }
.med b { font-family: var(--f-titulo); font-size: 1rem; line-height: 1.1; }
.med small { font-size: .78rem; color: var(--tinta2); line-height: 1.2; }
.med.falta { opacity: .55; }
.med.falta .med-ic { filter: grayscale(1); }
.med-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.med-acoes p { font-size: .9rem; color: var(--tinta2); min-width: 0; flex: 1 1 200px; }

/* ---------- Certificado ---------- */
.cert { background: var(--papel); border-radius: 20px; padding: clamp(18px, 5vw, 40px); text-align: center; border: 8px solid var(--sol);
  outline: 4px dashed var(--laranja); outline-offset: -18px; box-shadow: 0 14px 30px rgba(31,42,90,.2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cert h3 { font-size: clamp(1.8rem, 7vw, 3rem); color: var(--uva-esc); letter-spacing: .06em; }
.cert .cert-nome { font-family: var(--f-titulo); font-size: clamp(1.8rem, 8vw, 3.2rem); font-weight: 800; color: var(--coral-esc); border-bottom: 4px solid var(--linha); padding: 0 20px; line-height: 1.15; overflow-wrap: anywhere; }
.cert p { font-size: clamp(.95rem, 3vw, 1.2rem); max-width: 46ch; }
.cert .mascote { width: 120px; }
.cert-med { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.cert-med .med-ic { width: 54px; }
.cert small { color: var(--tinta2); }

@media (max-width: 640px) {
  .fases { grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
  .fase-ic { font-size: 2.5rem; height: 54px; }
  .fase-tit { font-size: 1.05rem; }
  .anos { gap: 8px; }
  .ano b { font-size: 2.1rem; }
  .ano small { font-size: .72rem; }
  .mapa-dica .mascote { width: 70px; }
  .fim-medalha { width: 88px; } .fim-linha .mascote { width: 96px; }
}
@media print {
  html, body, .app { height: auto; overflow: visible; background: #fff; }
  .cenario, .sem-imprimir, .retorno, .modal, .confete { display: none !important; }
  .tela { position: static; overflow: visible; animation: none; }
  .tela:not(#t-cert) { display: none !important; }
  .cert { box-shadow: none; }
}

:root { --verde-claro: #dff7e8; --coral-claro: #ffe4e0; --sol-claro: #fff4c7; --uva-claro: #ece7ff; --rosa-fundo: #c63a70; }

/* ---------- Tela da fase ---------- */
.fase { display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.tela-fase.com-retorno { padding-bottom: 300px; }
.fase-topo { display: flex; align-items: center; gap: 10px; }
.fase-meio { flex: 1; min-width: 0; }
#fase-nome { font-size: clamp(1.05rem, 4vw, 1.5rem); color: var(--papel); text-shadow: 0 2px 0 var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pontinhos { display: flex; gap: 6px; margin-top: 5px; }
.pontinhos i { flex: 1; max-width: 46px; height: 12px; border-radius: 12px; background: rgba(255,255,255,.5); box-shadow: inset 0 -2px 0 rgba(31,42,90,.15); }
.pontinhos i.atual { background: var(--papel); box-shadow: 0 0 0 3px var(--uva); }
.pontinhos i.ok { background: var(--verde); }
.pontinhos i.meio { background: var(--sol); }
.pontinhos i.nao { background: var(--coral); }
.fala { display: flex; align-items: center; gap: 12px; }
.fala .mascote { width: clamp(62px, 15vw, 100px); flex: none; }
.fala .balao { flex: 1; display: flex; align-items: center; gap: 10px; }
#fala-txt { flex: 1; min-width: 0; font-size: clamp(1.02rem, 3.5vw, 1.28rem); font-weight: 800; line-height: 1.25; }
#fala-txt b, #ret-exp b { color: var(--uva-esc); }
.ouvir { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--uva); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--uva-esc); }
.ouvir:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--uva-esc); }
.ouvir svg { width: 26px; height: 26px; }
.ouvir.falando { animation: chama .8s ease-in-out infinite; }
.palco { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 6px; }
.palco > * { animation: entra .3s ease both; }
.acoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; }
.preco { display: inline-block; background: var(--sol); color: var(--tinta); font-family: var(--f-titulo); font-weight: 800; padding: 0 10px; border-radius: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.treme { animation: treme .4s; }
@keyframes treme { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

/* ---------- Introdução da fase ---------- */
.intro { width: 100%; max-width: 560px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.intro-ic { font-size: 3.4rem; line-height: 1.1; }
.intro-ic .din { --din: 64px; }
.intro h3 { font-size: 1.6rem; color: var(--uva-esc); }
.intro p { font-size: 1.05rem; }
.intro ul { text-align: left; margin: 2px 0 8px; padding-left: 22px; font-size: .98rem; }

/* ---------- Múltipla escolha ---------- */
.w-visual { width: 100%; background: var(--papel); border-radius: 22px; padding: 14px; box-shadow: 0 5px 0 rgba(31,42,90,.1); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.w-visual .grande { font-size: 3.2rem; line-height: 1.1; }
.w-visual .rot { font-size: .9rem; color: var(--tinta2); text-transform: uppercase; letter-spacing: .06em; }
.w-visual .alvo { font-family: var(--f-titulo); font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1; color: var(--coral-esc); }
.w-visual.lado { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px 22px; }
.ops { width: 100%; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.ops.cols-1 { grid-template-columns: 1fr; }
.ops.cols-3 { grid-template-columns: repeat(3, 1fr); }
.ops.cols-4 { grid-template-columns: repeat(4, 1fr); }
.op { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 14px; border-radius: 18px; background: var(--papel); color: var(--tinta);
  font-family: var(--f-titulo); font-size: 1.4rem; font-weight: 800; text-align: left; border: 3px solid transparent;
  box-shadow: 0 6px 0 var(--linha), 0 10px 16px rgba(31,42,90,.12); transition: transform .08s, box-shadow .08s, border-color .15s; }
.op:hover { border-color: var(--uva); }
.op:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--linha); }
.op-letra { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--uva-claro); color: var(--uva-esc); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
.op-t { flex: 1; min-width: 0; }
.op.longa { font-family: var(--f-texto); font-size: 1.02rem; line-height: 1.25; }
.op.img { flex-direction: column; justify-content: center; text-align: center; padding: 12px 8px; gap: 6px; }
.op.img .op-t { flex: none; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.op.certa { background: var(--verde-claro); border-color: var(--verde); box-shadow: 0 6px 0 var(--verde-esc); }
.op.errada { background: var(--coral-claro); border-color: var(--coral); box-shadow: 0 6px 0 var(--coral-esc); animation: treme .4s; }
.ops.travada .op { pointer-events: none; }
.ops.travada .op:not(.certa):not(.errada) { opacity: .5; }

/* ---------- Montar valor ---------- */
.mesa { width: 100%; min-height: 96px; border-radius: 22px; border: 4px dashed rgba(31,42,90,.35); background: rgba(255,255,255,.55); padding: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.mesa.alvo-solta { background: var(--sol-claro); border-color: var(--laranja); }
.mesa-vazia { color: var(--tinta2); font-size: .98rem; text-align: center; }
.mesa-soma { font-family: var(--f-titulo); font-size: 1.25rem; background: var(--papel); padding: 2px 16px; border-radius: 999px; box-shadow: 0 3px 0 rgba(31,42,90,.12); }
.mesa-soma b { color: var(--uva-esc); font-variant-numeric: tabular-nums; }
.bandeja { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; background: var(--papel); border-radius: 22px; padding: 12px; box-shadow: 0 5px 0 rgba(31,42,90,.1); }
.peca { line-height: 0; border-radius: 14px; padding: 4px; touch-action: none; transition: transform .1s; }
.peca:hover { transform: translateY(-3px); }
.peca:active { transform: scale(.92); }
.mesa .peca { animation: pop .25s cubic-bezier(.2,1.6,.4,1) both; touch-action: manipulation; }
.arrastando { opacity: .35; }
.fantasma { position: fixed; z-index: 100; pointer-events: none; margin: 0; transform: translate(-50%, -50%) scale(1.12) rotate(-4deg); filter: drop-shadow(0 10px 10px rgba(31,42,90,.35)); }

/* ---------- Separar (arrastar e soltar) ---------- */
.cestos { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cesto { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 10px 8px; border-radius: 22px; min-height: 150px; color: #fff;
  background: var(--cc); box-shadow: 0 6px 0 var(--ccs); border: 4px solid transparent; text-align: center; transition: transform .1s; }
.cesto-ic { font-size: 2rem; line-height: 1.1; }
.cesto b { font-family: var(--f-titulo); font-size: clamp(1.05rem, 4.2vw, 1.4rem); letter-spacing: .03em; line-height: 1.1; }
.cesto small { font-size: .8rem; opacity: .95; line-height: 1.15; }
.cesto-itens { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; min-height: 34px; }
.cesto-itens span { background: var(--papel); border-radius: 12px; padding: 2px 8px; font-size: 1.5rem; line-height: 1.2; animation: pop .3s cubic-bezier(.2,1.6,.4,1) both; }
.cesto.alvo-solta, .cesto.chama { border-color: var(--papel); transform: scale(1.03); }
.cesto.chama { animation: chama .9s ease-in-out infinite; }
.fichas { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 86px; }
.ficha { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; width: clamp(96px, 28vw, 132px); min-height: 86px; padding: 6px; border-radius: 18px;
  background: var(--papel); color: var(--tinta); border: 4px solid transparent; box-shadow: 0 5px 0 var(--linha), 0 8px 14px rgba(31,42,90,.14); touch-action: none; user-select: none; -webkit-user-select: none; }
.ficha-e { font-size: 2.2rem; line-height: 1.15; }
.ficha-t { font-size: .88rem; font-weight: 800; line-height: 1.12; text-align: center; }
.ficha.larga { width: clamp(150px, 44vw, 210px); }
.ficha.sel { border-color: var(--uva); transform: translateY(-4px); }

/* ---------- Mercado ---------- */
.mercado { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 12px; align-items: start; }
.lista { background: var(--sol-claro); border-radius: 18px; padding: 10px 14px; box-shadow: 0 5px 0 rgba(31,42,90,.1); transform: rotate(-1.2deg); }
.lista h3 { font-size: 1.1rem; margin-bottom: 4px; }
.lista ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.lista li { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
.tic { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 3px solid var(--tinta); display: inline-flex; align-items: center; justify-content: center; }
.lista li.ok .tic { background: var(--verde); border-color: var(--verde-esc); color: #fff; }
.lista li.ok { text-decoration: line-through; opacity: .7; }
.tic svg { width: 16px; height: 16px; }
.prateleira { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--laranja); padding: 10px; border-radius: 20px; box-shadow: 0 6px 0 var(--laranja-esc); }
.produto { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 8px; border-radius: 14px; background: var(--papel); color: var(--tinta); touch-action: none; user-select: none; -webkit-user-select: none; border: 3px solid transparent; }
.produto:hover { border-color: var(--uva); }
.prod-e { font-size: 2.1rem; line-height: 1.15; }
.prod-t { font-size: .85rem; line-height: 1.1; text-align: center; }
.produto.foi { visibility: hidden; }
.carrinho { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 84px; padding: 8px 14px; border-radius: 22px; border: 4px dashed rgba(31,42,90,.35); background: rgba(255,255,255,.6); }
.carrinho.alvo-solta { background: var(--sol-claro); border-color: var(--laranja); }
.carro-ic { font-size: 2.6rem; line-height: 1; }
.carro-itens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 1.9rem; }
.carro-itens span { animation: pop .3s cubic-bezier(.2,1.6,.4,1) both; }
.carro-itens small { font-size: .95rem; color: var(--tinta2); }
.cupom { width: 100%; max-width: 380px; background: var(--papel); border-radius: 6px; padding: 10px 16px 12px; font-size: 1.05rem; box-shadow: 0 5px 0 rgba(31,42,90,.12);
  border-top: 8px dotted var(--linha); border-bottom: 8px dotted var(--linha); }
.w-visual.lado .cupom { flex: 1 1 240px; }
.pago { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cupom-l, .cupom-total { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.cupom-total { margin-top: 6px; padding-top: 6px; border-top: 3px dashed var(--tinta2); font-family: var(--f-titulo); font-size: 1.3rem; }
.cupom-total b { color: var(--coral-esc); }

/* ---------- Orçamento ---------- */
.orc { width: 100%; background: var(--papel); border-radius: 20px; padding: 10px 14px 12px; box-shadow: 0 5px 0 rgba(31,42,90,.1); }
.orc-linha { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; font-size: .98rem; }
.orc-linha b { font-family: var(--f-titulo); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.orc-barra { height: 20px; border-radius: 20px; background: var(--papel2); margin-top: 6px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(31,42,90,.1); }
.orc-barra i { display: block; height: 100%; width: 0; border-radius: 20px; background: var(--verde); transition: width .3s, background .3s; }
.orc.estourou .orc-barra i { background: var(--coral); }
.orc.estourou .orc-sobra { color: var(--coral-esc); }
.itens-plano { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item-plano { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px; border-radius: 18px; background: var(--papel); color: var(--tinta);
  border: 4px solid transparent; box-shadow: 0 5px 0 var(--linha); text-align: center; }
.ip-e { font-size: 2.1rem; line-height: 1.15; }
.ip-t { font-size: .9rem; line-height: 1.12; }
.ip-req { position: absolute; top: -8px; left: -4px; background: var(--coral); color: #fff; font-size: .7rem; padding: 0 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
.ip-ck { position: absolute; top: -8px; right: -6px; width: 30px; height: 30px; border-radius: 50%; background: var(--verde); color: #fff; display: none; align-items: center; justify-content: center; box-shadow: 0 2px 0 var(--verde-esc); }
.ip-ck svg { width: 18px; height: 18px; }
.item-plano.sel { border-color: var(--verde); background: var(--verde-claro); box-shadow: 0 5px 0 var(--verde-esc); }
.item-plano.sel .ip-ck { display: flex; }

/* ---------- Potes ---------- */
.potes-mao { font-family: var(--f-titulo); font-size: 1.3rem; background: var(--papel); padding: 4px 18px; border-radius: 999px; box-shadow: 0 4px 0 rgba(31,42,90,.12); }
.potes-mao b { color: var(--coral-esc); font-variant-numeric: tabular-nums; }
.potes { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pote { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--papel); border-radius: 20px; padding: 10px 6px; box-shadow: 0 5px 0 rgba(31,42,90,.1); }
.pote-vidro { position: relative; width: 78px; height: 84px; border-radius: 12px 12px 22px 22px; border: 4px solid var(--cp); background: var(--papel2); overflow: hidden; }
.pote-nivel { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--cp); opacity: .55; transition: height .3s; }
.pote-ic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
.pote-t { font-family: var(--f-titulo); font-size: 1.05rem; letter-spacing: .03em; }
.pote-v { font-family: var(--f-titulo); font-size: 1.25rem; color: var(--uva-esc); font-variant-numeric: tabular-nums; }
.pote-bts { display: flex; gap: 8px; }
.pm { width: 48px; height: 48px; border-radius: 14px; background: var(--cp); color: #fff; font-family: var(--f-titulo); font-size: 1.8rem; font-weight: 800; line-height: 1; box-shadow: 0 4px 0 rgba(31,42,90,.25); }
.pm:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(31,42,90,.25); }
.pote-auto { min-height: 48px; display: flex; align-items: center; text-align: center; font-size: .8rem; line-height: 1.15; color: var(--tinta2); }
.op.quase { background: var(--sol-claro); border-color: var(--laranja); box-shadow: 0 6px 0 var(--laranja-esc); }
.regra { background: var(--sol-claro); border-radius: 14px; padding: 6px 14px; font-size: 1rem; text-align: center; }

/* ---------- Sonhos e cofrinho ---------- */
.sonhos { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.sonho { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 6px; border-radius: 22px; background: var(--papel); color: var(--tinta); box-shadow: 0 6px 0 var(--linha), 0 10px 16px rgba(31,42,90,.12); border: 4px solid transparent; }
.sonho:hover { border-color: var(--uva); }
.sonho:active { transform: translateY(4px); }
.sonho-e { font-size: 3rem; line-height: 1.15; }
.sonho b { font-family: var(--f-titulo); font-size: 1.15rem; line-height: 1.1; text-align: center; }
.hud { width: 100%; }
.hud-cofre { display: flex; align-items: center; gap: 10px; background: var(--papel); border-radius: 999px; padding: 6px 14px; box-shadow: 0 4px 0 rgba(31,42,90,.12); }
.hud-e { font-size: 1.7rem; line-height: 1; }
.hud-barra { position: relative; flex: 1; height: 30px; border-radius: 30px; background: var(--papel2); overflow: hidden; }
.hud-barra i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--rosa), var(--sol)); border-radius: 30px; transition: width .8s cubic-bezier(.2,1,.4,1); }
.hud-barra b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-titulo); font-size: 1rem; font-variant-numeric: tabular-nums; }

/* ---------- Retorno ---------- */
.retorno { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: sobe .4s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes sobe { from { transform: translateY(110%); } to { transform: none; } }
.retorno[data-tipo="certo"] { --cr: var(--verde); --cre: var(--verde-esc); }
.retorno[data-tipo="meio"] { --cr: var(--laranja); --cre: var(--laranja-esc); }
.retorno[data-tipo="errado"] { --cr: var(--coral); --cre: var(--coral-esc); }
.retorno-cx { pointer-events: auto; max-width: 920px; margin: 0 auto; background: var(--papel); border-radius: 24px; border: 5px solid var(--cr);
  box-shadow: 0 -6px 30px rgba(31,42,90,.28); padding: 12px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; max-height: 64vh; overflow-y: auto; }
.retorno-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--cr); color: #fff; display: flex; align-items: center; justify-content: center; animation: pop .4s .15s cubic-bezier(.2,1.8,.4,1) both; }
.retorno-ic svg { width: 36px; height: 36px; }
#ret-tit { font-size: 1.45rem; color: var(--cre); }
#ret-exp { font-size: 1rem; }
#ret-exp .grupo-din { justify-content: flex-start; margin-top: 4px; --din: 38px; }
.retorno-acoes { display: flex; align-items: center; gap: 12px; }
#b-continuar { --cb: var(--cr); --cs: var(--cre); min-height: 60px; font-size: 1.4rem; padding: 8px 26px; }

@media (max-width: 640px) {
  :root { --din: 46px; }
  .ops.cols-4 { grid-template-columns: 1fr 1fr; }
  .ops.cols-3 { grid-template-columns: 1fr; }
  .op { font-size: 1.2rem; min-height: 60px; padding: 8px 10px; gap: 8px; }
  .op.longa { font-size: .96rem; }
  .op-letra { width: 30px; height: 30px; font-size: .95rem; }
  .mercado { grid-template-columns: 1fr; }
  .lista ul { flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  .prod-e { font-size: 1.8rem; }
  .retorno-cx { grid-template-columns: auto minmax(0, 1fr); }
  .retorno-acoes { grid-column: 1 / -1; }
  #b-continuar { flex: 1; }
  .retorno-ic { width: 48px; height: 48px; } .retorno-ic svg { width: 28px; height: 28px; }
  .sonho-e { font-size: 2.4rem; } .sonho b { font-size: 1rem; }
  .pote-vidro { width: 64px; height: 70px; } .pm { width: 44px; height: 44px; }
  .cesto { min-height: 132px; }
}
@media (min-width: 900px) and (min-height: 700px) {
  :root { --din: 68px; }
}

/* ---------- Vídeo falado: uma "TV" com palco animado e legenda ---------- */
.video { display: flex; flex-direction: column; gap: 12px; }
#v-tit { font-size: clamp(1.05rem, 4vw, 1.5rem); color: var(--papel); text-shadow: 0 2px 0 var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-barra { height: 12px; border-radius: 12px; background: rgba(255,255,255,.5); margin-top: 6px; overflow: hidden; box-shadow: inset 0 -2px 0 rgba(31,42,90,.15); }
.v-barra i { display: block; height: 100%; width: 0; background: var(--sol); border-radius: 12px; transition: width .4s; }
.tv { background: var(--tinta); border-radius: 30px; padding: 12px 12px 4px; box-shadow: 0 10px 0 rgba(31,42,90,.25), 0 18px 34px rgba(31,42,90,.25); }
.tv-tela { position: relative; isolation: isolate; border-radius: 20px; overflow: hidden; text-align: center;
  background: radial-gradient(circle at 50% 38%, var(--papel) 0 40%, var(--sol-claro) 100%);
  min-height: clamp(280px, 50vh, 460px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 18px 14px 74px; }
.tv-palco { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.tv-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 100%; }
.v-chip { background: var(--uva); color: #fff; border-radius: 999px; padding: 3px 14px; font-family: var(--f-titulo); font-size: clamp(.95rem, 3.4vw, 1.15rem); font-weight: 800;
  box-shadow: 0 3px 0 var(--uva-esc); animation: pop .4s cubic-bezier(.2,1.6,.4,1) both; }
.tv-masc { position: absolute; left: 8px; bottom: 4px; width: clamp(64px, 15vw, 96px); }
.tv-masc.fala .masc-corpo { animation: vFala .28s ease-in-out infinite alternate; }
@keyframes vFala { to { transform: translateY(-5px) scale(1.02, .97); } }

const W = {};

/* Arrastar e soltar com dedo ou mouse. Tocar também funciona (para quem tem dificuldade de arrastar). */
function arrastavel(elm, cfg) {
  let ini = null, movendo = false, fant = null, alvo = null, ignora = false;
  const zonas = () => cfg.zonas().filter(Boolean);
  function acha(x, y) {
    const zs = zonas();
    for (let i = 0; i < zs.length; i++) {
      const r = zs[i].getBoundingClientRect();
      if (x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 12 && y <= r.bottom + 12) return zs[i];
    }
    return null;
  }
  function limpa() {
    if (fant) { fant.remove(); fant = null; }
    elm.classList.remove('arrastando');
    zonas().forEach(z => z.classList.remove('alvo-solta'));
    ini = null; movendo = false; alvo = null;
  }
  elm.addEventListener('pointerdown', e => {
    if (e.button) return;
    ini = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { elm.setPointerCapture(e.pointerId); } catch (err) { /* ignora */ }
  });
  elm.addEventListener('pointermove', e => {
    if (!ini || e.pointerId !== ini.id) return;
    if (!movendo) {
      if (Math.hypot(e.clientX - ini.x, e.clientY - ini.y) < 10) return;
      movendo = true;
      const r = elm.getBoundingClientRect();
      fant = elm.cloneNode(true);
      fant.classList.add('fantasma'); fant.classList.remove('sel');
      fant.style.width = r.width + 'px'; fant.style.height = r.height + 'px';
      $('#app').appendChild(fant);
      elm.classList.add('arrastando');
      Som.tocar('pop');
    }
    fant.style.left = e.clientX + 'px'; fant.style.top = e.clientY + 'px';
    const z = acha(e.clientX, e.clientY);
    if (z !== alvo) { if (alvo) alvo.classList.remove('alvo-solta'); alvo = z; if (alvo) alvo.classList.add('alvo-solta'); }
    e.preventDefault();
  });
  const termina = e => {
    if (!ini) return;
    const era = movendo, z = alvo;
    limpa();
    if (era) {
      ignora = true; setTimeout(() => { ignora = false; }, 350);
      if (z && e.type === 'pointerup') cfg.aoSoltar(z);
    }
  };
  elm.addEventListener('pointerup', termina);
  elm.addEventListener('pointercancel', termina);
  elm.addEventListener('click', e => {
    if (ignora) { e.preventDefault(); e.stopPropagation(); return; }
    if (cfg.aoTocar) cfg.aoTocar();
  });
}
function tremer(e) { e.classList.remove('treme'); void e.offsetWidth; e.classList.add('treme'); setTimeout(() => e.classList.remove('treme'), 450); }

/* --- Múltipla escolha --- */
W.mc = function (p, palco, fim) {
  if (p.visual) palco.appendChild(el('div', 'w-visual' + (p.visualCls ? ' ' + p.visualCls : ''), p.visual));
  const temImg = p.ops.some(o => o.img);
  const longa = !temImg && p.ops.some(o => Voz.limpar(o.t).length > 24);

      '<span class="op-letra">' + 'ABCD'.charAt(i) + '</span><span class="op-t">' + o.t + '</span>');

    if (o.rotulo) b.setAttribute('aria-label', o.rotulo);
    b.addEventListener('click', () => {
      if (box.classList.contains('travada')) return;
      box.classList.add('travada');
      const nota = o.nota != null ? o.nota : (o.ok ? 1 : 0);
      b.classList.add(nota === 1 ? 'certa' : (nota > 0 ? 'quase' : 'errada'));
      if (nota < 1) $$('.op', box).forEach((x, j) => { if (p.ops[j].ok) x.classList.add('certa'); });
      fim({ nota: nota, explica: (o.pq ? o.pq + ' ' : '') + (p.explica || ''), escolha: o });
    });
    box.appendChild(b);
  });
  palco.appendChild(box);
};

/* --- Montar um valor com moedas e notas --- */
W.montar = function (p, palco, fim) {
  let pecas = [], tent = 0, travado = false;
  if (p.visual) palco.appendChild(el('div', 'w-visual' + (p.visualCls ? ' ' + p.visualCls : ''), p.visual));
  /* ocultaAlvo: o valor não aparece, porque descobrir o valor faz parte do desafio (ex.: calcular o troco). */
  const alvo = p.ocultaAlvo ? null : el('div', 'w-visual', '<span class="rot">' + (p.rotAlvo || 'Valor pedido') + '</span><b class="alvo">' + fmt(p.alvo) + '</b>');
  const mesa = el('div', 'mesa'); mesa.setAttribute('aria-label', 'Sua resposta');
  const somaCx = el('div', 'mesa-soma');
  const band = el('div', 'bandeja');
  const acoes = el('div', 'acoes');
  const bLimpar = el('button', 'btn btn-claro', 'Limpar'); bLimpar.type = 'button';
  const bOk = el('button', 'btn btn-verde', 'PRONTO!'); bOk.type = 'button';
  function desenha() {
    mesa.innerHTML = '';
    if (!pecas.length) mesa.appendChild(el('p', 'mesa-vazia', 'Toque nas moedas e notas para colocar aqui.<br>Você também pode arrastar!'));
    pecas.forEach((v, i) => {
      const b = el('button', 'peca', din(v)); b.type = 'button';
      b.setAttribute('aria-label', 'Tirar ' + rotuloDin(v));
      b.addEventListener('click', () => { if (travado) return; pecas.splice(i, 1); Som.tocar('pop'); desenha(); });
      mesa.appendChild(b);
    });
    somaCx.innerHTML = p.mostraSoma ? 'Você colocou: <b>' + fmt(soma(pecas)) + '</b>' : 'Peças colocadas: <b>' + pecas.length + '</b>';
  }
  function poe(v) {
    if (travado) return;
    if (pecas.length >= 14) { Mascote.diz('Já tem muitas peças! Toque em uma delas para tirar.', 'triste'); return; }
    pecas.push(v); Som.tocar('moeda'); desenha();
  }
  p.bandeja.forEach(v => {
    const b = el('button', 'peca', din(v)); b.type = 'button';
    b.setAttribute('aria-label', 'Colocar ' + rotuloDin(v));
    arrastavel(b, { zonas: () => [mesa], aoSoltar: () => poe(v), aoTocar: () => poe(v) });
    band.appendChild(b);
  });
  bLimpar.addEventListener('click', () => { if (travado) return; pecas = []; Som.tocar('clique'); desenha(); });
  bOk.addEventListener('click', () => {
    if (travado) return;
    if (!pecas.length) { Mascote.diz('Coloque as moedas e notas primeiro!', 'neutro'); tremer(mesa); return; }
    const s = soma(pecas); tent++;
    if (s === p.alvo) { travado = true; fim({ nota: tent === 1 ? 1 : .5, explica: p.explica }); return; }
    if (tent === 1) {
      Som.tocar('errado'); tremer(mesa);
      Mascote.diz(s > p.alvo ? 'Passou! Você colocou <b>' + fmt(s) + '</b>. Tire um pouco e tente de novo.'
        : 'Ainda falta! Você colocou <b>' + fmt(s) + '</b>. Coloque mais e tente de novo.', 'triste');
      return;
    }
    travado = true;
    const jeito = decompor(p.alvo, p.bandeja);
    fim({ nota: 0, explica: 'Você colocou ' + fmt(s) + ', mas o valor certo era <b>' + fmt(p.alvo) + '</b>. Um jeito de formar esse valor:' + (jeito ? grupoDin(jeito) : '') + (p.explica || '') });
  });
  acoes.appendChild(bLimpar); acoes.appendChild(bOk);
  [alvo, mesa, somaCx, band, acoes].forEach(x => { if (x) palco.appendChild(x); });
  desenha();
};

/* --- Separar em cestos (arrastar e soltar) --- */
W.separar = function (p, palco, fim) {
  let sel = null, feitos = 0;
  const erros = {}, zonas = {};
  const cestos = el('div', 'cestos'), fichas = el('div', 'fichas');
  const itens = shuffle(p.itens);
  function marca(f) {
    $$('.ficha', fichas).forEach(x => x.classList.remove('sel'));
    sel = f;
    Object.keys(zonas).forEach(k => zonas[k].classList.toggle('chama', !!f));
    if (f) f.classList.add('sel');
  }
  function termina() {
    const n = Object.keys(erros).length;
    const nota = n === 0 ? 1 : (n * 2 <= itens.length ? .5 : 0);
    let ex = p.explica || '';
    if (n) ex = 'Para lembrar: ' + Object.keys(erros).map(k => '<b>' + k + '</b>: ' + erros[k].pq).join(' ') + ' ' + ex;
    fim({ nota: nota, explica: ex });
  }
  function coloca(f, id) {
    const it = f._it;
    if (it.c === id) {
      Som.tocar('moeda');
      $('.cesto-itens', zonas[id]).appendChild(el('span', '', it.e));
      f.remove(); marca(null); feitos++;
      Mascote.diz('<b>' + it.t + '</b>: ' + it.pq, 'feliz');
      if (feitos === itens.length) setTimeout(termina, 1100);
    } else {
      erros[it.t] = it; Som.tocar('errado'); tremer(f); marca(null);
      Mascote.diz('Hum... pense mais um pouco sobre <b>' + it.t + '</b> e tente de novo!', 'triste');
    }
  }
  p.cestos.forEach(c => {
    const b = el('button', 'cesto', '<span class="cesto-ic">' + c.ic + '</span><b>' + c.t + '</b><small>' + (c.sub || '') + '</small><div class="cesto-itens"></div>');
    b.type = 'button'; b.style.setProperty('--cc', c.cor); b.style.setProperty('--ccs', c.cor2);
    b._id = c.id;
    b.addEventListener('click', () => {
      if (sel) coloca(sel, c.id);
      else Mascote.diz('Primeiro toque em uma figura. Depois toque no lugar dela!', 'neutro');
    });
    zonas[c.id] = b; cestos.appendChild(b);
  });
  itens.forEach(it => {
    const f = el('button', 'ficha' + (it.t.length > 18 ? ' larga' : ''), '<span class="ficha-e">' + it.e + '</span><span class="ficha-t">' + it.t + '</span>');
    f.type = 'button'; f._it = it;
    arrastavel(f, {
      zonas: () => Object.keys(zonas).map(k => zonas[k]),
      aoSoltar: z => coloca(f, z._id),
      aoTocar: () => { Som.tocar('clique'); marca(sel === f ? null : f); }
    });
    fichas.appendChild(f);
  });
  palco.appendChild(cestos); palco.appendChild(fichas);
};

/* --- Orçamento: escolher o que comprar sem passar do dinheiro --- */
W.plano = function (p, palco, fim) {

  const grade = el('div', 'itens-plano');

    const t = total();

    $('.orc-sobra', orc).innerHTML = t > p.orc ? 'Faltam <b>' + fmt(t - p.orc) + '</b>' : 'Sobra <b>' + fmt(p.orc - t) + '</b>';

    const b = el('button', 'item-plano', (x.req ? '<span class="ip-req">precisa</span>' : '') + '<i class="ip-ck">' + ICO.check + '</i>' +
      '<span class="ip-e">' + x.e + '</span><span class="ip-t">' + x.t + '</span><span class="preco">' + fmt(x.p) + '</span>');

      Som.tocar(sel[i] ? 'pop' : 'clique');

      if (!antes && orc.classList.contains('estourou')) Mascote.diz('Opa! Passou do dinheiro que você tem. Tire alguma coisa.', 'triste');

    if (falta.length) prob = 'Faltou comprar: ' + falta.map(x => '<b>' + x.t + '</b>').join(', ') + '. O que tem a etiqueta PRECISA é necessário!';
    else if (t > p.orc) prob = 'Você passou do orçamento em <b>' + fmt(t - p.orc) + '</b>. Tire algo que não é necessário.';

/* --- Potes: dividir o dinheiro (guardar, gastar, doar) --- */
W.potes = function (p, palco, fim) {

  const aloc = {}, cx = {};
  p.potes.forEach(x => { aloc[x.id] = 0; });
  /* O pote "auto" (GASTAR) recebe sozinho o que sobra: primeiro se separa o que guardar e doar. */
  const manuais = () => soma(p.potes.filter(x => x.id !== p.auto).map(x => aloc[x.id]));
  const mao = el('div', 'potes-mao', 'Você recebeu: <b>' + fmt(p.total) + '</b>');
  const grade = el('div', 'potes');
  function atualiza() {
    aloc[p.auto] = p.total - manuais();
    p.potes.forEach(x => {
      $('.pote-v', cx[x.id]).textContent = fmt(aloc[x.id]);
      $('.pote-nivel', cx[x.id]).style.height = (aloc[x.id] / p.total * 100) + '%';
    });
  }
  p.potes.forEach(x => {
    const c = el('div', 'pote', '<div class="pote-vidro"><i class="pote-nivel"></i><span class="pote-ic">' + x.ic + '</span></div><b class="pote-t">' + x.t + '</b><span class="pote-v"></span><div class="pote-bts"></div>');
    c.style.setProperty('--cp', x.cor);

    if (x.id === p.auto) { $('.pote-bts', c).innerHTML = '<small class="pote-auto">fica com o que sobrar</small>'; return; }
    const menos = el('button', 'pm', '−'); menos.type = 'button'; menos.setAttribute('aria-label', 'Tirar de ' + x.t);
    const mais = el('button', 'pm', '+'); mais.type = 'button'; mais.setAttribute('aria-label', 'Colocar em ' + x.t);
    menos.addEventListener('click', () => { if (travado) return; if (aloc[x.id] >= p.passo) { aloc[x.id] -= p.passo; Som.tocar('pop'); atualiza(); } });
    mais.addEventListener('click', () => {
      if (travado) return;
      if (manuais() + p.passo <= p.total) { aloc[x.id] += p.passo; Som.tocar('moeda'); atualiza(); }
      else { tremer(mao); Mascote.diz('O dinheiro acabou! Para colocar mais aqui, tire de outro pote.', 'neutro'); }
    });

  const bOk = el('button', 'btn btn-verde', 'PRONTO!'); bOk.type = 'button';
  bOk.addEventListener('click', () => {
    if (travado) return;
    const prob = p.regra(aloc); tent++;
    if (!prob) { travado = true; fim({ nota: tent === 1 ? 1 : .5, explica: p.explica }); return; }
    if (tent === 1) { Som.tocar('errado'); tremer(grade); Mascote.diz(prob + ' Tente de novo.', 'triste'); return; }
    travado = true;
    fim({ nota: 0, explica: prob + ' ' + (p.explica || '') });
  });
  acoes.appendChild(bOk);
  palco.appendChild(mao); palco.appendChild(grade);
  palco.appendChild(el('p', 'regra', p.regraTxt));
  palco.appendChild(acoes);
  atualiza();
};

    clique('#b-video', () => this.abrir('inicio'));
    clique('#b-video2', () => this.abrir('mapa'));
  }
};

;
/* ===== Resultado, medalhas, certificado, área do professor e ligação dos botões ===== */
const NIVEL = ['bronze', 'prata', 'ouro'];
const CONQUISTAS = [
  { id: 'inicio', ic: '★', t: 'Primeiros passos', d: 'Terminar a primeira fase' },
  { id: 'seq5', ic: '5', t: 'Sequência perfeita', d: 'Acertar 5 desafios seguidos' },
  { id: 'troco', ic: '$', t: 'Troco certo', d: 'Ganhar 3 estrelas no Mercado inteligente' },
  { id: 'sonho', ic: '♥', t: 'Sonho realizado', d: 'Encher o cofrinho e conquistar o sonho' },
  { id: 'mestre', ic: '✓', t: 'Mestre do orçamento', d: 'Acertar os dois orçamentos de primeira' },
  { id: 'missao', ic: '6', t: 'Missão cumprida', d: 'Terminar as 6 fases' },
  { id: 'super', ic: '18', t: 'Super estrela', d: 'Ganhar 3 estrelas em todas as fases' }
];
function verificarConquistas(j, est) {
  const novas = [], pr = S.prog[S.ano], ctx = j.dados.ctx, chaves = Object.keys(pr);
  const dar = id => {
    const k = S.ano + ':' + id;
    if (!S.conq[k]) { S.conq[k] = true; novas.push(CONQUISTAS.filter(c => c.id === id)[0]); }
  };
  dar('inicio');
  if (j.maxSeq >= 5) dar('seq5');
  if (j.fase.n === 2 && est === 3) dar('troco');
  if (j.fase.n === 5 && ctx.realizou) dar('sonho');
  if (j.fase.n === 6 && ctx.planosOk === 2) dar('mestre');
  if (chaves.length === 6) dar('missao');
  if (chaves.length === 6 && chaves.every(k => pr[k].est === 3)) dar('super');
  return novas;
}

function mostrarFim(j, est, novas, ant, msg) {
  const f = j.fase;
  $('#fim-sub').textContent = 'Fase ' + f.n + ' · ' + f.nome + ' · ' + S.ano + 'º ano';
  $('#fim-tit').textContent = est === 3 ? 'Fase completa!' : (est === 2 ? 'Muito bem!' : 'Fase concluída!');
  $('#fim-estrelas').innerHTML = [1, 2, 3].map(k => ICO.estrela(est >= k ? '' : 'vazia')).join('');
  $('#fim-medalha').innerHTML = medalhaSVG(NIVEL[est - 1], String(f.n));
  Mascote.por('masc-fim', 'feliz');
  $('#fim-pontos').innerHTML = 'Você fez <b>' + j.pontos + '</b> pontos' + (ant.vezes && j.pontos > ant.pts ? ' · novo recorde!' : '');
  $('#fim-msg').textContent = (msg ? msg + ' ' : '') + ['Medalha de bronze! Errar faz parte de aprender. Jogue de novo e veja como você melhora.',
    'Medalha de prata! Jogue de novo para buscar o ouro.', 'Medalha de ouro! Você domina esse assunto.'][est - 1];
  $('#fim-novas').innerHTML = novas.map(c => '<span class="nova"><span class="med-ic">' + medalhaSVG('conquista', c.ic) + '</span><span>Nova conquista: <b>' + c.t + '</b></span></span>').join('');
  $('#b-prox').hidden = f.n >= FASES.length;
  Tela.ir('fim');
  Som.tocar('vitoria'); confete(est === 3 ? 90 : 50);
  if (novas.length) setTimeout(() => Som.tocar('medalha'), 1300);
  if (novas.some(c => c.id === 'missao')) {
    setTimeout(() => abrirModal('<h2>Missão cumprida!</h2><p>Você terminou as 6 fases e aprendeu a cuidar do dinheiro. Seu certificado está pronto!</p>',
      [{ t: 'Depois' }, { t: 'Ver certificado', cls: 'btn-verde', fn: () => { desenhaCert(); voltaCert = 'mapa'; Tela.ir('cert'); } }]), 2200);
  }
}

let voltaMed = 'inicio', voltaCert = 'medalhas';
function desenhaMedalhas() {
  $('#med-ano').textContent = S.ano + 'º ano';
  const pr = S.prog[S.ano];
  $('#med-fases').innerHTML = FASES.map(f => {
    const d = pr[f.n], nv = d ? NIVEL[d.est - 1] : 'bronze';
    return '<div class="med' + (d ? '' : ' falta') + '"><span class="med-ic">' + medalhaSVG(nv, String(f.n)) + '</span><b>' + f.nome + '</b><small>' +
      (d ? cap(nv) + ' · ' + d.pts + ' pontos' : 'Ainda não jogou') + '</small></div>';
  }).join('');
  $('#med-conq').innerHTML = CONQUISTAS.map(c => '<div class="med' + (S.conq[S.ano + ':' + c.id] ? '' : ' falta') + '"><span class="med-ic">' +
    medalhaSVG('conquista', c.ic) + '</span><b>' + c.t + '</b><small>' + c.d + '</small></div>').join('');
  const feitas = fasesFeitas();
  $('#b-cert').disabled = feitas < 6;
  $('#cert-dica').textContent = feitas === 6 ? 'Parabéns! Seu certificado está pronto.' : 'Termine as 6 fases para ganhar o certificado. ' + (6 - feitas === 1 ? 'Falta 1 fase.' : 'Faltam ' + (6 - feitas) + ' fases.');
}
function irMedalhas(de) {
  if (!S.ano) { abrirJogador(); return; }
  voltaMed = de; desenhaMedalhas(); Tela.ir('medalhas');
}
function desenhaCert() {
  const pr = S.prog[S.ano];
  $('#cert').innerHTML = '<div class="mascote" data-humor="feliz">' + mascoteSVG() + '</div><h3>CERTIFICADO</h3><p>Este certificado é de</p>' +
    '<div class="cert-nome">' + esc(S.nome || 'Estudante nota 10') + '</div>' +
    '<p>que completou a missão <b>Aprender a cuidar do dinheiro</b> no nível do <b>' + S.ano + 'º ano</b>, com <b>' + totalPontos() + ' pontos</b> e <b>' + totalEstrelas() + ' de 18 estrelas</b>.</p>' +
    '<div class="cert-med">' + FASES.map(f => '<span class="med-ic">' + medalhaSVG(pr[f.n] ? NIVEL[pr[f.n].est - 1] : 'bronze', String(f.n)) + '</span>').join('') + '</div>' +
    '<p>Agora você sabe ganhar, gastar, economizar e planejar!</p><small>' + new Date().toLocaleDateString('pt-BR') + '</small>';
}

function abrirJogador() {
  $('#in-nome').value = S.nome || '';
  $('#ck-voz').checked = !!S.voz;
  const ano = S.ano || 5;
  $$('.ano').forEach(b => { const s = Number(b.dataset.ano) === ano; b.classList.toggle('sel', s); b.setAttribute('aria-pressed', s ? 'true' : 'false'); });
  Tela.ir('jogador');
}
function entrar() {
  const sel = $('.ano.sel');
  S.nome = $('#in-nome').value.replace(/\s+/g, ' ').trim().slice(0, 24);
  S.ano = sel ? Number(sel.dataset.ano) : 5;
  S.voz = $('#ck-voz').checked && Voz.ok;
  usarPerfil(S.nome); salvar(); irMapa();
}
function atualizaSom() {
  $$('.btn-som').forEach(b => { b.innerHTML = S.som ? ICO.som : ICO.mudo; b.setAttribute('aria-pressed', S.som ? 'true' : 'false'); });
}
function abrirProfessor() {
  abrirModal('<h2>Para o professor</h2>' +
    '<p>Jogo de educação financeira para o 3º, 4º e 5º anos. O aluno aprende a ganhar, gastar, economizar e planejar o dinheiro.</p>' +
    '<h3>Como funciona</h3><ul><li>Comece pelo <b>vídeo “Conheça o dinheiro”</b> (cerca de 4 minutos): o Dindim narra, com legendas, a história do dinheiro, as moedas e as notas do Real, como reconhecer uma nota verdadeira e como cuidar do dinheiro. Dá para pausar e voltar as cenas.</li><li>São <b>6 fases</b> com <b>5 desafios</b> cada: 30 desafios por ano escolar.</li>' +
    '<li>Os desafios são sorteados e os valores mudam: cada partida é diferente.</li>' +
    '<li>Cada resposta traz uma explicação. A fase rende de 1 a 3 estrelas e uma medalha de bronze, prata ou ouro.</li>' +
    '<li>Ao terminar as 6 fases, o aluno recebe um certificado com o nome dele.</li></ul>' +
    '<h3>Os três níveis</h3><ul><li><b>3º ano:</b> reconhecer moedas e notas, pequenas somas e escolhas simples.</li>' +
    '<li><b>4º ano:</b> compras, troco, multiplicação e comparação de preços.</li>' +
    '<li><b>5º ano:</b> orçamento, porcentagens simples (10%, 25%, 50% e 75%) e consumo consciente.</li></ul>' +
    '<h3>Habilidades da BNCC relacionadas</h3><ul><li>EF03MA24: comparação e equivalência de valores em compra, venda e troca.</li>' +
    '<li>EF04MA25: compra e venda, troco e desconto, consumo ético e consciente.</li>' +
    '<li>EF05MA06: porcentagens de 10%, 25%, 50%, 75% e 100% em contextos de educação financeira.</li></ul>' +
    '<h3>Dicas de uso</h3><ul><li>Na tela “Quem vai jogar?”, ligue <b>Ler as perguntas em voz alta</b> para alunos com dificuldade de leitura. O botão roxo de alto-falante lê a pergunta a qualquer momento.</li>' +
    '<li>Nos desafios de arrastar, também dá para tocar na figura e depois no lugar dela.</li>' +
    '<li>O progresso fica guardado neste aparelho, separado pelo nome de cada aluno.</li></ul>',
    [{ t: 'Apagar o progresso deste aparelho', cls: 'btn-coral', fn: () => abrirModal('<h2>Apagar tudo?</h2><p>As estrelas, os pontos e as medalhas de todos os alunos neste aparelho serão apagados. Não dá para desfazer.</p>',
      [{ t: 'Cancelar' }, { t: 'Apagar', cls: 'btn-coral', fn: () => { S.perfis = {}; usarPerfil(S.nome); salvar(); abrirModal('<h2>Pronto!</h2><p>O progresso deste aparelho foi apagado.</p>'); } }]) },
    { t: 'Fechar', cls: 'btn-verde' }]);
}

function iniciar() {
  carregar();
  try {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap';
    document.head.appendChild(l);
  } catch (e) { /* sem internet: usa as fontes do aparelho */ }
  Mascote.por('masc-inicio', 'neutro');
  const chuva = $('#chuva');
  [[100, 4, 6], [25, 86, 0], [50, 0, 52], [10, 92, 58], [5, 12, 92], [100, 80, 96]].forEach((c, i) => {
    const t = el('div', '', din(c[0])), d = t.firstChild;
    d.style.left = c[1] + '%'; d.style.top = c[2] + '%'; d.style.animationDelay = (-i * .7) + 's';
    chuva.appendChild(d);
  });
  $('#b-sair').innerHTML = ICO.casa;
  $('#b-volta-med').innerHTML = ICO.voltar; $('#b-volta-cert').innerHTML = ICO.voltar;
  $$('.ouvir').forEach(b => { b.innerHTML = ICO.som; b.hidden = !Voz.ok; });
  if (!Voz.ok) $('.chave').hidden = true;
  if (window.JOGO_ARQUIVO) $('#b-imprimir').hidden = false;
  atualizaSom();
  Video.ligar();

  const clique = (id, fn) => $(id).addEventListener('click', () => { Som.tocar('clique'); fn(); });
  clique('#b-jogar', abrirJogador);
  clique('#b-medalhas0', () => irMedalhas('inicio'));
  clique('#b-prof', abrirProfessor);
  clique('#b-entrar', entrar);
  clique('#b-trocar', abrirJogador);
  clique('#b-medalhas', () => irMedalhas('mapa'));
  clique('#b-volta-med', () => { if (voltaMed === 'mapa') irMapa(); else Tela.ir('inicio'); });
  clique('#b-cert', () => { desenhaCert(); voltaCert = 'medalhas'; Tela.ir('cert'); confete(60); });
  clique('#b-volta-cert', () => { if (voltaCert === 'mapa') irMapa(); else { desenhaMedalhas(); Tela.ir('medalhas'); } });
  clique('#b-imprimir', () => { try { window.print(); } catch (e) { /* ignora */ } });
  clique('#b-continuar', () => Jogo.proximo());
  clique('#b-denovo', () => Jogo.abrirFase(Jogo.fase.n));
  clique('#b-prox', () => Jogo.abrirFase(Jogo.fase.n + 1));
  clique('#b-mapa', irMapa);
  clique('#b-sair', () => {
    if (Jogo.i < 0) { irMapa(); return; }
    abrirModal('<h2>Sair da fase?</h2><p>Os pontos desta rodada não ficam guardados. Você pode jogar a fase de novo depois.</p>',
      [{ t: 'Continuar jogando', cls: 'btn-verde' }, { t: 'Sair', fn: irMapa }]);
  });
  $('#b-ouvir').addEventListener('click', e => Voz.falar($('#fala-txt').innerHTML, e.currentTarget));
  $('#b-ouvir2').addEventListener('click', e => Voz.falar($('#ret-tit').textContent + '. ' + $('#ret-exp').innerHTML, e.currentTarget));
  $$('.btn-som').forEach(b => b.addEventListener('click', () => {
    S.som = !S.som; salvar(); atualizaSom();
    if (Tela.atual === 'video') Video.trocouSom();
    else if (S.som) Som.tocar('clique'); else Voz.parar();
  }));
  $$('.ano').forEach(b => b.addEventListener('click', () => {
    Som.tocar('clique');
    $$('.ano').forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  }));
  $('#in-nome').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); entrar(); } });
  $('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) $('#modal').hidden = true; });
  document.addEventListener('pointerdown', () => Som.iniciar(), { once: true });
}
iniciar();
